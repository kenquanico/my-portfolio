<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ShopCo fashion storefront preview</title>
  <desc id="desc">A monochrome fashion marketplace preview with bold typography and an editorial hero.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#cbd8e2"/>
      <stop offset="1" stop-color="#eff1f2"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8da8c0"/>
      <stop offset="1" stop-color="#526d88"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#f2f0f1"/>
  <rect width="1600" height="62" fill="#050505"/>
