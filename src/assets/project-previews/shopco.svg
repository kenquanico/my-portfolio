  <text x="58" y="952" fill="#666" font-family="Arial, Helvetica, sans-serif" font-size="20">International Brands</text>
  <text x="242" y="952" fill="#666" font-family="Arial, Helvetica, sans-serif" font-size="20">High-Quality Products</text>
  <text x="500" y="952" fill="#666" font-family="Arial, Helvetica, sans-serif" font-size="20">Happy Customers</text>
