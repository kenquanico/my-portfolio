    <circle cx="116" cy="72" r="58" fill="#d4ab91"/>
    <path d="M61 70c5-59 96-76 119-16-36-16-62-15-119 16Z" fill="#202020"/>
    <path d="M51 316c6-119 25-191 65-202 40 11 65 83 71 202l40 255H5Z" fill="url(#coat)"/>
    <path d="m80 125 36 92 38-92" fill="#eee7df"/>
