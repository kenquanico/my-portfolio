  <path d="M875 790c142-109 293-181 441-221 104-28 198-33 284-17v448H875Z" fill="#b1b6b5"/>
  <path d="m1134 603 160-105 162 105v397h-322Z" fill="#d6d1ca"/>
  <path d="m1094 619 199-141 204 141-25 34-179-126-175 126Z" fill="#a8a29c"/>
